version: "1"

services:
  - type: web
    name: gateway
    env: node
    buildCommand: npm install && cd services/gateway && npm install
    startCommand: cd services/gateway && node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: coffee-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: coffee-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_URL
        value: http://auth-service:10000
      - key: BRANCH_URL
        value: http://branch-service:10000
      - key: MENU_URL
        value: http://menu-service:10000
      - key: ORDER_URL
        value: http://order-service:10000
      - key: LOYALTY_URL
        value: http://loyalty-service:10000
      - key: REPORT_URL
        value: http://report-service:10000

  - type: pserv
    name: auth-service
    env: node
    buildCommand: npm install && cd services/auth-service && npm install
    startCommand: cd services/auth-service && node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: coffee-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: coffee-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  - type: pserv
    name: branch-service
    env: node
    buildCommand: npm install && cd services/branch-service && npm install
    startCommand: cd services/branch-service && node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: coffee-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: coffee-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  - type: pserv
    name: menu-service
    env: node
    buildCommand: npm install && cd services/menu-service && npm install
    startCommand: cd services/menu-service && node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: coffee-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: coffee-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  - type: pserv
    name: order-service
    env: node
    buildCommand: npm install && cd services/order-service && npm install
    startCommand: cd services/order-service && node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: coffee-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: coffee-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  - type: pserv
    name: loyalty-service
    env: node
    buildCommand: npm install && cd services/loyalty-service && npm install
    startCommand: cd services/loyalty-service && node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: coffee-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: coffee-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  - type: pserv
    name: report-service
    env: node
    buildCommand: npm install && cd services/report-service && npm install
    startCommand: cd services/report-service && node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: coffee-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: coffee-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  - type: redis
    name: coffee-redis
    ipAllowList: []
    plan: free

databases:
  - name: coffee-postgres
    databaseName: coffee
    user: coffee
    plan: free
